<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скачать файл</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #1e1e2f 0%, #2d2d44 50%, #1a1a2e 100%);
    padding: 20px;
    overflow: hidden;
  }

  /* Анимированные круги на фоне */
  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    z-index: 0;
  }

  body::before {
    width: 400px;
    height: 400px;
    background: #6366f1;
    top: -100px;
    left: -100px;
    animation: float 8s ease-in-out infinite;
  }

  body::after {
    width: 350px;
    height: 350px;
    background: #ec4899;
    bottom: -100px;
    right: -100px;
    animation: float 10s ease-in-out infinite reverse;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.1); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    padding: 48px 36px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    animation: appear 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .icon {
    width: 90px;
    height: 90px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-radius: 22px;
    box-shadow: 0 12px 30px rgba(99, 102, 241, 0.5);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 12px 30px rgba(99, 102, 241, 0.5); }
    50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(99, 102, 241, 0.7); }
  }

  .icon svg {
    width: 44px;
    height: 44px;
    stroke: #fff;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  h1 {
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    color: rgba(255, 255, 255, 0.6);
    font-size: 15px;
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .file-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 24px;
    font-size: 14px;
  }

  .file-info .name {
    color: #fff;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-info .name svg {
    width: 18px;
    height: 18px;
    stroke: #8b5cf6;
    flex-shrink: 0;
  }

  .file-info .size {
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    flex-shrink: 0;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 17px 24px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transition: left 0.6s;
  }

  .btn:hover::before {
    left: 100%;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 35px rgba(99, 102, 241, 0.6);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn svg {
    width: 20px;
    height: 20px;
    stroke: #fff;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .note {
    margin-top: 20px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.35);
  }

  @media (max-width: 480px) {
    .card { padding: 36px 24px; }
    h1 { font-size: 22px; }
    .icon { width: 76px; height: 76px; }
    .icon svg { width: 36px; height: 36px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24">

        <polyline points="7 10 12 15 17 10"/>

    <h1>Готово к загрузке</h1>
    <p class="subtitle">Нажмите кнопку ниже, чтобы скачать файл</p>

    <div class="file-info">
      <span class="name">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        file.rar

      <span class="size">24.5 МБ</span>
    </div>

        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </a>

    <a href="плюшка.DOCX"><p class="note">Файл проверен и безопасен</p></a>
  </div>

</body>
</html>
